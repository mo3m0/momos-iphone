

<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#f7e9ed">

  <title>Momo's iPhone</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="device framed" id="device">

    <div class="dynamic-island"></div>

    <div class="status-bar">

      <span>9:41</span>

      <span>● ● ● ▰</span>

    </div>

    <!-- Lock Screen -->

    <section class="lock-screen" id="lockScreen">

      <div class="lock-clock">9:41</div>

      <div class="lock-date">Tuesday, November 10</div>

      <div class="lock-bottom">

        <span>🔦</span>

        <button onclick="unlockPhone()">點一下解鎖 ↑</button>

        <span>📷</span>

      </div>

    </section>

    <!-- Home Screen -->

    <section class="home-screen phone-page" id="homeScreen" hidden>

      <div class="home-widget">

        <p>Good afternoon ♡</p>

        <h2>Momo's iPhone</h2>

        <small>Have a lovely day!</small>

      </div>

      <div class="app-grid">

        <button class="app-icon" onclick="Phone.open('kakaoScreen')">

          <span>💬</span>

          <small>KakaoTalk</small>

        </button>

        <button class="app-icon" onclick="Phone.open('photosScreen')">

          <span>🌸</span>

          <small>Photos</small>

        </button>

        <button class="app-icon" onclick="Phone.open('notesScreen')">

          <span>📝</span>

          <small>Notes</small>

        </button>

        <button class="app-icon" onclick="Phone.open('calendarScreen')">

          <span>📅</span>

          <small>Calendar</small>

        </button>

        <button class="app-icon" onclick="Phone.open('musicScreen')">

          <span>🎵</span>

          <small>Music</small>

        </button>

        <button class="app-icon" onclick="Phone.open('settingsScreen')">

          <span>⚙️</span>

          <small>Settings</small>

        </button>

        <button class="app-icon" onclick="Phone.open('cameraScreen')">

          <span>📷</span>

          <small>Camera</small>

        </button>

        <button class="app-icon" onclick="Phone.open('mailScreen')">

          <span>✉️</span>

          <small>Mail</small>

        </button>

      </div>

      <div class="dock">

        <span>📞</span>

        <span>💬</span>

        <span>🌐</span>

        <span>🎵</span>

      </div>

    </section>

    <!-- KakaoTalk -->

    <section class="app-window kakao-app phone-page" id="kakaoScreen" hidden>

      <header class="kakao-header">

        <button onclick="Phone.home()">‹</button>

        <h2>KakaoTalk</h2>

        <span>＋</span>

      </header>

      <nav class="kakao-tabs">

        <button onclick="showKakaoTab('friends')">Friends</button>

        <button onclick="showKakaoTab('chats')">Chats</button>

        <button onclick="showKakaoTab('profile')">Profile</button>

      </nav>

      <div class="kakao-content">

        <div id="friendsTab">

          <h3>Friends</h3>

          <p>Your friends will appear here ♡</p>

          <button onclick="addDemoFriend()">＋ Add a friend</button>

        </div>

        <div id="chatsTab" hidden>

          <h3>Chats</h3>

          <p>Your conversations will appear here.</p>

        </div>

        <div id="profileTab" hidden>

          <h3>My Profile</h3>

          <p>Momo ♡</p>

        </div>

      </div>

      <div class="kakao-yellow">

        KakaoTalk

      </div>

    </section>

    <!-- Other App Screens -->

    <section class="app-window phone-page" id="photosScreen" hidden>

      <h2>Photos</h2>

      <button onclick="Phone.home()">‹ Home</button>

    </section>

    <section class="app-window phone-page" id="notesScreen" hidden>

      <h2>Notes</h2>

      <button onclick="Phone.home()">‹ Home</button>

    </section>

    <section class="app-window phone-page" id="calendarScreen" hidden>

      <h2>Calendar</h2>

      <button onclick="Phone.home()">‹ Home</button>

    </section>

    <section class="app-window phone-page" id="musicScreen" hidden>

      <h2>Music</h2>

      <button onclick="Phone.home()">‹ Home</button>

    </section>

    <section class="app-window phone-page" id="settingsScreen" hidden>

      <h2>Settings</h2>

      <button onclick="Phone.home()">‹ Home</button>

    </section>

    <section class="app-window phone-page" id="cameraScreen" hidden>

      <h2>Camera</h2>

      <button onclick="Phone.home()">‹ Home</button>

    </section>

    <section class="app-window phone-page" id="mailScreen" hidden>

      <h2>Mail</h2>

      <button onclick="Phone.home()">‹ Home</button>

    </section>

  </main>

  <script src="app.js"></script>

  <script>

    function unlockPhone() {

      document.getElementById("lockScreen").hidden = true;

      document.getElementById("homeScreen").hidden = false;

    }

    function showKakaoTab(tab) {

      ["friends", "chats", "profile"].forEach(name => {

        document.getElementById(name + "Tab").hidden = name !== tab;

      });

    }

    function addDemoFriend() {

      const name = prompt("Enter your friend's name:");

      if (!name || !name.trim()) return;

      const friend = KakaoTalk.addFriend(name.trim());

      StoryStorage.save();

      const list = document.getElementById("friendsTab");

      const item = document.createElement("p");

      item.textContent = "👤 " + friend.name;

      list.appendChild(item);

    }

  </script>

</body>

</html>
